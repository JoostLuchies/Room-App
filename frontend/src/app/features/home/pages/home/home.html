<section class="hero">

    <div class="hero-content">

        <span class="hero-label">
            Welkom bij RoomFindr
        </span>

        <h1>
            Vind jouw volgende kamer.
        </h1>

        <h2>
            Swipe. Match. Verhuis.
        </h2>

        <p>
            Swipe door beschikbare kamers of vind een nieuwe huisgenoot.
            RoomFindr brengt woningzoekenden en aanbieders eenvoudig samen.
        </p>

        <div class="hero-buttons">

            <button
                mat-raised-button
                routerLink="/auth/register/tenant">

                Ik zoek een kamer

            </button>

            <button
                mat-stroked-button
                routerLink="/auth/register/provider">
                
                Ik bied een kamer aan

            </button>

        </div>

    </div>

    <div class="hero-preview">

        <mat-card>

            <div class="image-placeholder">

                Kamerfoto

            </div>

            <mat-card-content>

                <h3>Studentenkamer Groningen</h3>

                <p>€650 per maand</p>

                <p>18 m² • Gemeubileerd</p>

            </mat-card-content>

            <mat-card-actions>

                <button mat-button>❤️</button>

            <button mat-button>❌</button>

            </mat-card-actions>

        </mat-card>

    </div>

</section>
